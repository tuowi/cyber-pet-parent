server:
  port: 8083

spring:
  application:
    name: social-service
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${cyber.db.host}:3306/cyber_social?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${cyber.db.pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${cyber.redis.host}
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: ${cyber.db.host}:8848
      config:
        server-addr: ${cyber.db.host}:8848
        file-extension: yaml

# 日志输出
logging:
  level:
    com.heima: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler # 配置枚举处理器
  global-config:
    db-config:
      id-type: ASSIGN_ID          # 使用雪花算法
      logic-delete-field: deleted  # 配置逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sentinel 控制台
spring.cloud.sentinel:
  transport:
    dashboard: 192.168.111.129:8080
  datasource:
    flow:
      nacos:
        server-addr: 192.168.111.129:8848
        data-id: ${spring.application.name}-flow-rules
        rule-type: flow

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  openapi:
    title: 社交服务接口文档
    description: "社交服务接口文档"
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.heima.shop.controller

cyber:
  image:
    post-path: C:/Users/86157/Documents/University/avatar/post/



