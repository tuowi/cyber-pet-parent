server:
  port: 8086

spring:
  application:
    name: auth-service
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${cyber.db.host}:3306/cyber_user?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${cyber.db.pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${cyber.redis.host}
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.111.129:8848
      config:
        server-addr: 192.168.111.129:8848
        file-extension: yaml

# 日志输出
logging:
  level:
    com.heima: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler # 配置枚举处理器
  global-config:
    db-config:
      id-type: ASSIGN_ID          # 使用雪花算法
      logic-delete-field: deleted  # 配置逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sentinel 控制台
spring.cloud.sentinel:
  transport:
    dashboard: 192.168.111.129:8080
  datasource:
    flow:
      nacos:
        server-addr: 192.168.111.129:8848
        data-id: ${spring.application.name}-flow-rules
        rule-type: flow

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  openapi:
    title: 用户管理接口文档
    description: "用户管理接口文档"
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.heima.auth.controller

cyber:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    secret-key: itcast1234567890itcast1234567890
    # 设置jwt过期时间（2小时）
    token-TTL: 7200000
    # 设置前端传递过来的令牌名称
    token-name: Authentication
  auth:
    excludePaths:
      - /auth/login
      - /auth/register

  avatar:
    auth-path: C:/Users/86157/Documents/University/avatar/auth/


